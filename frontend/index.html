<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Predict-11 · IPL Fantasy XI</title>
<style>
  :root {
    --bg: #0f1020; --card: #1a1c33; --line: #2b2e4a;
    --accent: #6c8cff; --gold: #ffce4f; --text: #e8e9f3; --muted: #9aa0c0;
    --wk: #34d399; --bat: #60a5fa; --ar: #fbbf24; --bowl: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: radial-gradient(1200px 600px at 50% -10%, #1b1e3d, var(--bg)); color: var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end;
              background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, button { font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
                   background: #12142a; color: var(--text); }
  button { background: var(--accent); color: #0b0d1c; font-weight: 600; cursor: pointer; border: none; }
  button:disabled { opacity: .5; cursor: default; }
  .field { flex: 1; min-width: 200px; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; margin: 22px 0 10px; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
          position: relative; }
  .role { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px;
          color: #0b0d1c; }
  .role.WK { background: var(--wk); } .role.BAT { background: var(--bat); }
  .role.AR { background: var(--ar); } .role.BOWL { background: var(--bowl); }
  .name { font-weight: 600; margin: 8px 0 2px; font-size: 16px; }
  .team { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; }
  .stats div b { color: var(--accent); }
  .badge { position: absolute; top: 12px; right: 12px; font-weight: 800; font-size: 12px;
           background: var(--gold); color: #0b0d1c; padding: 2px 8px; border-radius: 999px; }
  .badge.vc { background: #c0c6e8; }
  .fgn { color: var(--gold); }
  .err { color: var(--bowl); margin-top: 16px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Predict-<span>11</span></h1>
  <p class="sub">LightGBM fantasy-point model + constraint optimizer · trained on 17 IPL seasons of Cricsheet data</p>

  <div class="controls">
    <div class="field">
      <label for="t1">Team 1</label>
      <select id="t1"></select>
    </div>
    <div class="field">
      <label for="t2">Team 2</label>
      <select id="t2"></select>
    </div>
    <button id="go">Predict XI</button>
  </div>

  <div id="out"></div>
</div>

<script>
const API = location.origin;
const fmt = s => s.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());

async function loadTeams() {
  const teams = await (await fetch(`${API}/api/teams`)).json();
  const t1 = document.getElementById("t1"), t2 = document.getElementById("t2");
  teams.forEach(t => {
    t1.add(new Option(t.name, t.slug));
    t2.add(new Option(t.name, t.slug));
  });
  t1.selectedIndex = 5; t2.selectedIndex = 8; // MI vs RCB by default
}

function card(p) {
  const badge = p.is_captain ? `<span class="badge">C</span>`
              : p.is_vice_captain ? `<span class="badge vc">VC</span>` : "";
  const fgn = p.foreign ? ` <span class="fgn">✈</span>` : "";
  const debut = p.debut_or_unknown ? ` · <span class="fgn">new</span>` : "";
  return `<div class="card">${badge}
    <span class="role ${p.role}">${p.role}</span>
    <div class="name">${p.player}${fgn}</div>
    <div class="team">${p.team} · ${p.credits} cr${debut}</div>
    <div class="stats">
      <div>pred <b>${p.pred_points}</b></div>
      <div>form ${p.recent_form}</div>
    </div></div>`;
}

async function predict() {
  const team1 = document.getElementById("t1").value;
  const team2 = document.getElementById("t2").value;
  const out = document.getElementById("out");
  const btn = document.getElementById("go");
  out.innerHTML = ""; btn.disabled = true; btn.textContent = "Optimizing…";
  try {
    const r = await fetch(`${API}/api/predict`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ team1, team2 }),
    });
    if (!r.ok) { out.innerHTML = `<p class="err">${(await r.json()).detail}</p>`; return; }
    const d = await r.json();
    out.innerHTML = `
      <div class="meta">
        <div>Fixture <b>${d.fixture.team1} vs ${d.fixture.team2}</b></div>
        <div>Captain <b>${d.captain}</b></div>
        <div>Vice <b>${d.vice_captain}</b></div>
        <div>Credits <b>${d.total_credits}/100</b></div>
        <div>Overseas <b>${d.foreign_count}</b></div>
        <div>Exp. points <b>${d.expected_points}</b></div>
      </div>
      <div class="grid">${d.xi.map(card).join("")}</div>
      <p class="legend">pred = model's expected Dream11 points · form = last-5-match average · C=2×, VC=1.5×</p>`;
  } catch (e) {
    out.innerHTML = `<p class="err">${e}</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "Predict XI";
  }
}

document.getElementById("go").addEventListener("click", predict);
loadTeams();
</script>
</body>
</html>
