name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: p11, POSTGRES_PASSWORD: p11, POSTGRES_DB: p11}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U p11" --health-interval 3s --health-retries 20
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run alembic upgrade head
      # tests marked `integration` need the loaded IPL database (make db-up + ingest); CI runs
      # against an empty schema, so they run locally only
      - run: uv run pytest -q -m "not integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --testTimeout=30000
