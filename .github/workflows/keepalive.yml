name: keep-alive
# Free tiers sleep: Supabase pauses after 7 idle days, Render after 15 idle minutes. Ping the API
# (its /seasons endpoint reads Postgres) every 2 days. Set repository variable API_URL,
# e.g. https://predict11-api.onrender.com
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Wake API and database
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "${{ vars.API_URL }}/api/v1/seasons" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
